(function () {
  var f = document.getElementById('f');
  var pwEl = document.getElementById('pw');
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');

  function b64(s) {
    var bin = atob(s), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function unlock(pw) {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(PAYLOAD.s), iterations: PAYLOAD.it, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.i) }, key, b64(PAYLOAD.d));
    return new TextDecoder().decode(plain);
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '확인 중';
    unlock(pwEl.value).then(function (html) {
      document.open();
      document.write(html);
      document.close();
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = '확인';
      err.style.display = 'block';
      pwEl.select();
    });
  });
})();
</script>
